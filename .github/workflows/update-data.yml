name: Update data snapshots

on:
  workflow_dispatch:
  schedule:
    # Run twice daily: 05:00 and 17:00 UTC
    # - Items: BLS Average Retail Prices API
    # - Billionaires: Forbes Real-Time Billionaires API (official, no key)
    # Both updaters are self-contained Node scripts in scripts/; this workflow
    # is the single source of truth for data freshness. Snapshots are committed
    # back to main, which also keeps the repo active so GitHub does not disable
    # this schedule for inactivity.
    - cron: "0 5,17 * * *"

permissions:
  contents: write
  actions: write # needed to dispatch the Pages redeploy workflow

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run item price updater
        id: items
        run: |
          npm run update:items
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Run billionaire updater
        id: billionaires
        run: |
          # Fetches the Forbes Real-Time Billionaires API directly.
          # On failure it writes the last-known-good snapshot flagged stale=true
          # (exit code 2), which is reported by the freshness check below.
          npm run update:billionaires
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check data freshness
        id: freshness
        run: node scripts/check_freshness.js

      - name: Commit updated snapshots
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/richest_people.json data/richest_people.json app/data/cpi_items.json data/cpi_items.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "chore: update data snapshots [$(date -u +%Y-%m-%d)]"
          git push
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: Trigger Pages redeploy
        # A push made with GITHUB_TOKEN does not trigger other workflows, so the
        # deploy.yml run that publishes these snapshots would never fire on its
        # own and the live site would keep serving yesterday's numbers.
        # workflow_dispatch is the documented exception and does create a run.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Fail if data is still stale
        # Deliberately the LAST step: a stale snapshot must never block the
        # commit above, but a pipeline that has stopped refreshing should show
        # up as a red run (GitHub emails the owner) instead of silently serving
        # old numbers for months.
        run: node scripts/check_freshness.js --strict
